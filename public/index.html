function rubric(d){
  const r = d.rubric; if(!r?.length) return "";
  const sum = r.reduce((a,x)=>a+(Number(x.points)||0),0); const pc = p => p>0?"bull":p<0?"bear":"flat"; const mx = r.length*2;
  return `<section class="panel"><h2>Scorecard</h2><div class="tbl"><table><thead><tr><th>Factor</th><th>Input</th><th style="text-align:right">Pts</th></tr></thead><tbody>${r.map(x=>`
    <tr><td>${esc(x.factor)}</td><td class="inp">${esc(x.input)}</td><td class="pts ${pc(x.points)}">${signed(x.points)}</td></tr>`).join("")}
    <tr class="total"><td>Total ${signed(sum)} of ±${mx}</td><td class="inp">score = total ÷ ${mx} × 100</td><td class="pts ${pc(d.score)}">${signed(d.score)}</td></tr></tbody></table></div></section>`;
}

/* ---------- positioning ---------- */
const fin = v => v !== "" && v != null && isFinite(Number(v));
const fmtN = v => Number(v).toLocaleString("en-US",{maximumFractionDigits:2});
function ladder(sym, p, imp, inp){
  const spot = Number(p.spot), am = Number(imp?.amMovePts)||0;
  const items = [];
  const add = (v, lbl, col, kind) => { if(fin(v)) items.push({v:Number(v), lbl, col, kind}); };
  add(p.callWall, "Call wall", "var(--loss)", "solid");
  add(p.flip, "Gamma flip", "var(--muted)", "dash");
  add(p.putWall, "Put wall", "var(--gain)", "solid");
  if(inp){ add(inp.vah, "VAH", "var(--ice)", "dot"); add(inp.poc, "POC", "var(--ice)", "dot"); add(inp.val, "VAL", "var(--ice)", "dot"); add(inp.onHigh, "ON high", "var(--warn)", "dot"); add(inp.onLow, "ON low", "var(--warn)", "dot"); }
  if(!fin(spot) && !items.length) return "";
  const vals = items.map(i=>i.v); if(fin(spot)){ vals.push(spot); if(am){ vals.push(spot+am, spot-am); } }
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = Math.max((hi-lo)*0.08, spot*0.0015 || 1); lo -= pad; hi += pad;
  const W = 320, H = 220, T = 8, B = 8, X0 = 12, X1 = 196, LX = 204;
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const lines = items.map(i => `<line x1="${X0}" x2="${X1}" y1="${y(i.v).toFixed(1)}" y2="${y(i.v).toFixed(1)}" stroke="${i.col}" stroke-width="${i.kind==="solid"?2:1.5}" ${i.kind==="dash"?'stroke-dasharray="6 4"':i.kind==="dot"?'stroke-dasharray="2 4" stroke-linecap="round"':""}/>`).join("");
  const band = fin(spot) && am ? `<rect x="${X0}" y="${y(spot+am).toFixed(1)}" width="${X1-X0}" height="${(y(spot-am)-y(spot+am)).toFixed(1)}" fill="rgba(var(--accent-rgb),.13)" rx="6"/><text x="${X0+6}" y="${(y(spot+am)+12).toFixed(1)}" font-size="10" fill="var(--accent-hi)" font-family="JetBrains Mono, ui-monospace, monospace">AM range ±${Math.round(am)}</text>` : "";
  const spotLine = fin(spot) ? `<line x1="${X0}" x2="${X1}" y1="${y(spot).toFixed(1)}" y2="${y(spot).toFixed(1)}" stroke="var(--text)" stroke-width="2.5"/><circle cx="${X1}" cy="${y(spot).toFixed(1)}" r="4.5" fill="var(--text)"/>` : "";
  const labels = items.map(i => ({y:y(i.v), t:i.lbl, v:i.v, col:i.col}));
  if(fin(spot)) labels.push({y:y(spot), t:"Spot", v:spot, col:"var(--text)", bold:true});
  labels.sort((a,b)=>a.y-b.y);
  for(let k=1;k<labels.length;k++) if(labels[k].y - labels[k-1].y < 13) labels[k].y = labels[k-1].y + 13;
  const over = labels.length ? labels[labels.length-1].y - (H - 6) : 0; if(over > 0) labels.forEach(l => l.y -= over);
  const txt = labels.map(l => `<text x="${LX}" y="${(l.y+3.5).toFixed(1)}" font-size="10.5" fill="${l.col}" font-family="JetBrains Mono, ui-monospace, monospace" ${l.bold?'font-weight="700"':""}>${esc(l.t)} <tspan font-weight="700" font-stretch="115%">${fmtN(l.v)}</tspan></text>`).join("");
  return `<div class="ladder"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${sym} gamma levels">${band}${lines}${spotLine}${txt}</svg></div>`;
}
function positioning(br, only){
  const P = br.positioning; if(!P) return "";
  const inpAll = S.inputs[br.date] || {};
  const one = sym => { const p = P[sym]; if(!p) return ""; const imp = br.implied?.[sym]; const reg = p.regime;
    return `<div class="pos"><div class="pos-head"><span class="sym">${sym}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${reg && reg!=="n/a"?`<span class="tag ${reg==="positive"?"acc":"bear"}">${reg==="positive"?"Positive gamma":"Negative gamma"}</span>`:""}${p.netGex?`<span class="muted" style="font-size:12px">${esc(p.netGex)}</span>`:""}</span></div>
      ${ladder(sym, p, imp, inpAll[sym])}
      ${p.note?`<p class="note">${esc(p.note)}</p>`:""}<p class="faint" style="font-size:11.5px">${esc(p.source||"")}${imp?.iv?` · ${esc(imp.iv)}`:""}</p></div>`; };
  const syms = only ? [only] : ["NQ","ES"];
  const btn = (S.canRun || S.canLevels) ? `<button class="icon-btn" id="levels" style="height:30px;font-size:12px">My levels</button>` : "";
  return `<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="eyebrow">Dealer positioning</span>${btn}</div>
    <div class="pos-grid" style="${only?"grid-template-columns:1fr":""}">${syms.map(one).join("")}</div></section>`;
}
function surprises(br){
  const s = br.surprises; if(!s?.length) return "";
  return `<section class="panel"><span class="eyebrow">Data surprises · z-score vs consensus</span><div>${s.map(x=>{
    const z = Number(x.signedZ ?? x.z) || 0, w = Math.min(Math.abs(z),3)/3*50;
    return `<div class="zrow"><span><b style="font-weight:600">${esc(x.event)}</b><br><span class="muted" style="font-size:12px">${esc(x.actual)} vs ${esc(x.consensus)}</span></span>
      <span class="zbar"><i style="${z>=0?`left:50%`:`right:50%`};width:${w}%;background:${z>=0?"var(--gain)":"var(--loss)"}"></i></span><span class="zv ${z>0?"bull":z<0?"bear":"flat"}">${z>0?"+":z<0?"−":""}${Math.abs(z).toFixed(1)}</span></div>`; }).join("")}</div>
    <p class="faint" style="font-size:11.5px">Signed for equities: right of center helps stocks, left hurts.</p></section>`;
}
function factorAccuracy(){
  const graded = S.briefs.filter(b => b.grade);
  const block = sym => {
    const agg = {};
    graded.forEach(b => { const g = b.grade[sym]; const r = b.instruments?.[sym]?.rubric; if(!g || !r || g.result==="n/a" || !g.movePct) return;
      r.forEach(f => { const p = Number(f.points)||0; if(!p) return; const k = f.factor; agg[k] = agg[k] || {n:0,ok:0}; agg[k].n++; if(Math.sign(p) === Math.sign(Number(g.movePct))) agg[k].ok++; }); });
    const rows = Object.entries(agg).sort((a,b)=>b[1].n-a[1].n);
    if(!rows.length) return `<p class="muted" style="font-size:12.5px">${sym}: no graded days with a non-zero factor yet.</p>`;
    return `<div class="facc"><span class="sym" style="font-size:13px">${sym}</span>${rows.map(([k,v])=>{ const pc = Math.round(v.ok/v.n*100);
      return `<div class="frow"><span>${esc(k)}</span><span class="fbar"><i style="width:${pc}%;background:${pc>=55?"var(--gain)":pc<=45?"var(--loss)":"var(--muted)"}"></i></span><span>${v.ok}/${v.n} · ${pc}%</span></div>`; }).join("")}</div>`; };
  return `<section class="panel"><span class="eyebrow">Which factors actually call it</span><div class="track">${block("NQ")}${block("ES")}</div>
    <p class="muted" style="font-size:12.5px">How often each factor's sign matched the 9:30–12:00 move, counting only days it scored non-zero. Give it about 20 graded days before reading much into it.</p></section>`;
}
function levelsSheet(){
  const br = latest(); const date = br?.date; if(!date) return "";
  const v = S.inputs[date] || {};
  const f = (sym, k, lbl) => `<label>${lbl}<input id="in-${sym}-${k}" inputmode="decimal" value="${esc(v[sym]?.[k] ?? "")}" placeholder="—"></label>`;
  const grp = sym => `<div style="display:flex;flex-direction:column;gap:8px"><span class="sym">${sym}</span>
    <div class="fgroup">${f(sym,"flip","Gamma flip")}${f(sym,"callWall","Call wall")}${f(sym,"putWall","Put wall")}</div>
    <div class="fgroup"><label>Net GEX<select id="in-${sym}-gex"><option value="">—</option><option value="positive" ${v[sym]?.gex==="positive"?"selected":""}>Positive</option><option value="negative" ${v[sym]?.gex==="negative"?"selected":""}>Negative</option></select></label>${f(sym,"onHigh","ON high")}${f(sym,"onLow","ON low")}</div>
    <div class="fgroup">${f(sym,"vah","Prior VAH")}${f(sym,"poc","Prior POC")}${f(sym,"val","Prior VAL")}</div></div>`;
  return `<div class="scrim" id="scrim"><form class="sheet form" id="levels-form" role="dialog" aria-modal="true" aria-label="My levels">
    <div class="sheet-head"><div><h2 style="font-stretch:120%">My levels</h2><span class="muted" style="font-size:12px">${esc(fmtDate(date))} · futures points · from MenthorQ, GEXradar or your profile</span></div><button type="button" class="icon-btn" id="sheet-close" aria-label="Close">${IC.close}</button></div>
    ${grp("NQ")}${grp("ES")}
    <label style="display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)">Note<textarea id="in-note" placeholder="Anything the run should know">${esc(v.note||"")}</textarea></label>
    <p class="muted" style="font-size:12px">Your gamma levels replace the public ones. VAH/VAL score the auction factor. The next run uses them, or tap Save &amp; rescore.</p>
    ${S.saveMsg?`<div class="notice ${S.saveErr?"err":""}">${esc(S.saveMsg)}</div>`:""}
    <div class="form-actions"><button type="submit" class="icon-btn" data-after="save">Save</button>${TRIGGER_ID && S.canRun?`<button type="submit" class="icon-btn btn-primary" data-after="rescore">Save &amp; rescore</button>`:""}</div>
  </form></div>`;
}
async function saveLevels(after){
  const br = latest(); if(!br || !S.db) { S.saveMsg = "Levels can't be saved in this view."; S.saveErr = true; render(); return; }
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim().replace(/,/g,"") : ""; };
  const ks = ["flip","callWall","putWall","gex","onHigh","onLow","vah","poc","val"];
  const doc = {note: g("in-note"), updatedAt: new Date().toISOString()};
  for(const sym of ["NQ","ES"]){ doc[sym] = {}; for(const k of ks){ const val = g(`in-${sym}-${k}`); if(k !== "gex" && val && !isFinite(Number(val))){ S.saveMsg = `${sym} ${k} isn't a number.`; S.saveErr = true; render(); return; } doc[sym][k] = val; } }
  try{ await S.db.doc("inputs/" + br.date).set(doc); S.inputs[br.date] = doc; S.saveMsg = null; S.saveErr = false; S.levels = false;
    if(after === "rescore") await runNow(); else { S.runMsg = "Levels saved. The next run uses them."; S.runErr = false; }
  }catch(err){ S.saveMsg = err?.code === "permission_denied" || err?.code === "not_granted" ? "Only you can save levels here." : "Couldn't save: " + (err?.message || err?.code || "unknown error"); S.saveErr = true; }
  render();
}

/* ---------- views ---------- */
function heroLine(h){ h = String(h||""); const i = h.indexOf(": "); return i > 12 && i < 110 ? `<span class="lead">${esc(h.slice(0,i))}</span>${esc(h.slice(i+2))}` : esc(h); }
function today(br){
  const I = br.instruments || {};
  const ev = br.scenarios?.length ? scenarios(br.scenarios) : "";
  const R = recStats(), isLatest = br.id === latest()?.id, L = isLatest ? liveSession(br) : null, V = S.vote && S.vote.day === br.id ? S.vote : null;
  const vt = V ? (V.bull||0) + (V.bear||0) : 0, vbp = vt ? Math.round(V.bull / vt * 100) : 0, vOpen = V && Date.now() < Date.parse(V.closesAt);
  const sx = L ? (br.sessions || []).find(x => x.key === L.sd.key) : null;
  const w = S.tape?.weights, m = br.midCheck, g = br.grade?.NQ, sc = br.scenarios || [], P = br.positioning?.NQ, dr = br.drivers || [];
  const sum = {
    vote: V ? (vOpen ? `Open until 9:30 · ${vt ? `${vbp}% long so far` : "no votes yet"}` : `${vbp}% of the desk went long`) : "",
    plan: L ? `${L.sd.name} · ${L.st === "live" ? "live now" : "up next"} · NQ ${label(sx?.nq || I.NQ?.bias)}` : "",
    mid: m ? ({intact:"Morning read intact", weakening:"Morning read weakening", invalidated:"Morning read invalidated"}[m.status] || "") : "",
    result: g && g.result && g.result !== "n/a" ? `NQ ${g.result} · ${pct(g.movePct)} in the AM` : "",
    record: R.rate != null ? `${R.hits}W–${R.miss}L · ${R.rate}% hit rate${R.streak >= 2 ? ` · ${R.streak} in a row` : ""}` : `${R.n} graded so far`,
    bigtech: w?.length ? `${w.filter(x => x.chg > 0).length} of ${w.length} green` : "",
    sessions: L ? `${L.sd.name} ${L.st === "live" ? "live" : "next"}` : `${(br.sessions || []).length} sessions`,
    levels: P ? `NQ ${P.regime === "negative" ? "negative" : "positive"} gamma${P.callWall ? ` · call wall ${fmtN(P.callWall)}` : ""}` : "",
    scen: sc.length ? `${sc[0].event} · ${sc[0].status === "resolved" ? "resolved" : "pending"}` : "",
    drivers: dr.length ? (() => { const tw = dr.filter(d => d.effect === "tailwind").length, hw = dr.filter(d => d.effect === "headwind").length; return `${tw} tailwind${tw === 1 ? "" : "s"} · ${hw} headwind${hw === 1 ? "" : "s"}`; })() : "",
  };
  return `${flashBanner(br)}${alertBanner(br)}${tminus(br)}${liveAnswer(br)}${tapeStrip(br)}
    <div class="duo">${instCard("NQ",callOf(br,"NQ"),br)}${instCard("ES",callOf(br,"ES"),br)}</div>
    ${engine(br)}${newsTeaser(br)}${pushNudge()}
    <div class="folds">
    ${fold("vote", "Your call", sum.vote, voteBox(br), vOpen)}
    ${fold("plan", "Session plan", sum.plan, mission(br))}
    ${fold("result", "Result", sum.result, resultPanel(br), true)}
    ${fold("mid", "Mid-session check", sum.mid, midPanel(br))}
    ${fold("record", "Track record", sum.record, record())}
    ${fold("bigtech", "Big tech", sum.bigtech, heatmap())}
    ${fold("sessions", "Session map", sum.sessions, sessionMap(br))}
    ${fold("levels", "Dealer levels", sum.levels, positioning(br))}
    ${fold("scen", "Scenarios", sum.scen, ev)}
    ${fold("drivers", "Macro drivers", sum.drivers, drivers(br))}
    </div>`;
}
function detail(sym, br){
  const d = (br.instruments||{})[sym];
  if(!d) return `<section class="panel empty"><h2>No ${sym} read in this brief</h2></section>`;
  const sec = (t, arr, k) => arr?.length ? `<section class="panel"><h2>${t}</h2><ul class="list ${k}">${arr.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ul></section>` : "";
  return `<section class="panel inst" style="--card-rgb:${rgbVar(d.bias)};cursor:default">
      <div class="inst-head"><span class="sym">${sym}<small>${SYM[sym]} · ${esc(br.session||"NY AM")}</small></span>${conviction(d.conviction,d.bias)}</div>
      <div class="dial-row">${dial("d-"+sym+br.id, d.score, d.bias)}<span class="bias-word ${cls(d.bias)}" style="font-size:38px">${label(d.bias)}</span></div>
      <p class="thesis" style="display:block">${esc(d.thesis)}</p>
    </section>
    ${positioning(br, sym)}${rubric(d)}${sec("Why this window", d.why, "pro")}${sec("Opposing case", d.opposing, "con")}${sec("What would change it", d.changeIt, "flip")}`;
}

function trendChart(){
  const days = chrono(); if(!days.length) return "";
  const W = 640, H = 190, L = 34, R = 12, T = 14, B = 26;
  const x = i => days.length === 1 ? (L + (W-L-R)/2) : L + i*(W-L-R)/(days.length-1);
  const y = v => T + (100 - v) * (H-T-B) / 200;
  const grid = [100,50,0,-50,-100].map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.5"':'stroke-dasharray="3 5"'}/><text x="${L-6}" y="${y(v)+3.5}" font-size="10" fill="var(--faint)" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace">${v>0?"+":v<0?"−":""}${Math.abs(v)}</text>`).join("");
  const series = (sym, color) => { const pts = days.map((b,i) => { const c = finalCall(b)[sym]; return c ? [x(i), y(Number(c.score)||0), b, c] : null; }).filter(Boolean);
    const line = pts.length > 1 ? `<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : "";
    const marks = pts.map(p => { const r = p[2].grade?.[sym]?.result; const ring = r==="hit" ? "var(--gain)" : r==="miss" ? "var(--loss)" : "var(--panel)";
      const sel = p[2].id === S.rp.day; return `<circle class="pt" data-day="${esc(p[2].id)}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${sel?6:4.5}" fill="${color}" stroke="${ring}" stroke-width="${r?2.5:1.5}"><title>${esc(fmtDate(p[2].date))} · ${sym} ${signed(p[3].score)}${r?" · "+r:""}</title></circle>`; }).join("");
    return line + marks; };
  const labels = days.length <= 12 ? days.map((b,i)=>`<text x="${x(i)}" y="${H-8}" font-size="10" fill="var(--faint)" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">${esc(fmtDate(b.date,{weekday:undefined}))}</text>`).join("")
    : [0, days.length-1].map(i=>`<text x="${x(i)}" y="${H-8}" font-size="10" fill="var(--faint)" text-anchor="${i?"end":"start"}" font-family="JetBrains Mono, ui-monospace, monospace">${esc(fmtDate(days[i].date,{weekday:undefined}))}</text>`).join("");
  return `<section class="panel chart"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="eyebrow">Bias score by day</span>
      <span class="legend"><span><i style="width:14px;height:3px;border-radius:2px;background:var(--accent);display:inline-block"></i>NQ</span><span><i style="width:14px;height:3px;border-radius:2px;background:var(--ice);display:inline-block"></i>ES</span><span><i style="width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--gain);display:inline-block"></i>Hit</span><span><i style="width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px var(--loss);display:inline-block"></i>Miss</span></span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Final bias score per day for NQ and ES">${grid}${series("ES","var(--ice)")}${series("NQ","var(--accent)")}${labels}</svg></section>`;
}
function replay(){
  if(!S.briefs.length) return empty();
  const days = chrono();
  if(!S.rp.day || !days.some(b=>b.id===S.rp.day)) S.rp.day = latest().id;
  const b = days.find(x=>x.id===S.rp.day); const st = steps(b);
  if(S.rp.step >= st.length) S.rp.step = st.length - 1;
  const cur = st[S.rp.step] || {}; const idx = days.indexOf(b);
  const chips = days.map(d => { const c = finalCall(d); const g = d.grade || {};
    const mark = r => r==="hit"?"✓":r==="miss"?"✗":r==="scratch"?"–":"";
    return `<button class="day" data-rday="${esc(d.id)}" aria-current="${d.id===b.id}"><b>${esc(fmtDate(d.date))}</b>
      <span><i class="mini ${cls(c.NQ?.bias)}"></i>NQ ${mark(g.NQ?.result)}</span><span><i class="mini ${cls(c.ES?.bias)}"></i>ES ${mark(g.ES?.result)}</span></button>`; }).join("");
  const stepBar = st.map((s,i)=>`<button class="step ${i<S.rp.step?"done":""} ${i===S.rp.step?"now":""} ${S.rp.playing?"":"paused"}" data-rstep="${i}"><i></i>${STEP_LABEL[s.kind]}${s.at?` · ${esc(fmtTime(s.at))}`:""}</button>`).join("");
  const sd = sym => { const d = cur[sym] || {}; const g = cur.kind==="result" ? cur.grade?.[sym] : null;
    const stamp = g ? `<span class="stamp ${g.result==="hit"?"bull":g.result==="miss"?"bear":"flat"}">${esc(String(g.result).toUpperCase())}</span>` : "";
    return `<div class="sd">${dial("r-"+sym, d.score, d.bias)}${stamp}<span class="sym">${sym}</span><span class="tag ${cls(d.bias)}">${label(d.bias)}</span>${d.conviction?conviction(d.conviction,d.bias):""}${g?`<span class="big ${g.movePct>0?"bull":g.movePct<0?"bear":"flat"}" style="font-size:18px">${pct(g.movePct)}</span>`:""}</div>`; };
  let text;
  if(cur.kind === "result") text = `<span class="eyebrow">What happened · ${esc(cur.grade?.basis||"")}</span><p>${esc(cur.headline || "Graded against the 9:30–12:00 move.")}</p>`;
  else text = `<span class="eyebrow">${STEP_LABEL[cur.kind]} read${cur.regime?` · ${esc(cur.regime)}`:""}</span>${cur.headline?`<p style="font-size:15.5px;font-weight:500">${esc(cur.headline)}</p>`:`<p class="muted">Only the score was saved for this step.</p>`}${cur.NQ?.thesis?`<p class="thesis muted" style="font-size:13.5px">NQ: ${esc(cur.NQ.thesis)}</p>`:""}`;
  const sc = cur.kind !== "result" && cur.scenarios?.length ? scenarios(cur.scenarios, `Scenario map as of ${STEP_LABEL[cur.kind].toLowerCase()}`) : "";
  return `${trendChart()}
    <section class="panel"><span class="eyebrow">Pick a day</span><div class="days" id="days">${chips}</div></section>
    <section class="panel stage" style="--card-rgb:${rgbVar(cur.NQ?.bias)}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="font-stretch:120%;font-size:19px">${esc(fmtDate(b.date,{weekday:"long"}))}</h2><span class="muted" style="font-size:12px">Day ${idx+1} of ${days.length}</span></div>
      <div class="steps" style="--n:${st.length};--step-ms:${STEP_MS}ms">${stepBar}</div>
      <div class="stage-dials">${sd("NQ")}${sd("ES")}</div>
      <div class="stage-text">${text}</div>
      <div class="controls">
        <button class="icon-btn" id="rp-prev" aria-label="Previous step">${IC.prev}</button>
        <button class="icon-btn btn-primary play" id="rp-play" aria-label="${S.rp.playing?"Pause":"Play"}">${S.rp.playing?IC.pause:IC.play}</button>
        <button class="icon-btn" id="rp-next" aria-label="Next step">${IC.next}</button>
      </div>
      <p class="foot">Play runs through each step, then on to the next day.</p>
    </section>${sc}`;
}
function trackRecord(){
  const graded = chrono().filter(b => b.grade);
  const block = sym => {
    const rs = graded.map(b => b.grade[sym]).filter(r => r && r.result && r.result !== "n/a");
    const dir = rs.filter(r => r.bias !== "neutral");
    const hits = dir.filter(r=>r.result==="hit").length, misses = dir.filter(r=>r.result==="miss").length, scr = dir.filter(r=>r.result==="scratch").length;
    const rate = hits+misses ? Math.round(hits/(hits+misses)*100) + "%" : "—";
    const conv = ["low","medium","high"].map(c => { const x = dir.filter(r=>r.conviction===c); const h = x.filter(r=>r.result==="hit").length, m = x.filter(r=>r.result==="miss").length;
      return `<div><span>${c[0].toUpperCase()+c.slice(1)} conviction</span><span>${h}/${h+m}${h+m?` · ${Math.round(h/(h+m)*100)}%`:""}</span></div>`; }).join("");
    const neu = rs.filter(r=>r.bias==="neutral"); const nh = neu.filter(r=>r.result==="hit").length;
    const dots = rs.slice(-30).map(r => `<i class="${r.bias==="neutral" ? (r.result==="hit"?"nhit":"nmiss") : r.result}" title="${esc(r.bias)} ${esc(r.result)}"></i>`).join("");
    return `<div class="trk"><div class="trk-top"><span class="sym">${sym}</span><span class="rate">${rate}<small>${hits}–${misses}${scr?` · ${scr} scratch`:""}</small></span></div>
      <div class="dots">${dots || '<span class="muted" style="font-size:12.5px">No graded sessions yet.</span>'}</div>
      <div class="rows">${conv}<div><span>Neutral calls (chop)</span><span>${nh}/${neu.length}</span></div></div></div>`; };
  const n = graded.length;
  return `<section class="panel"><span class="eyebrow">Track record · 9:30–12:00 ET</span><div class="track">${block("NQ")}${block("ES")}</div>
    <div class="legend"><span><span class="dots"><i class="hit"></i></span>Hit</span><span><span class="dots"><i class="miss"></i></span>Miss</span><span><span class="dots"><i class="scratch"></i></span>Scratch</span><span><span class="dots"><i class="nhit"></i></span>Neutral</span></div>
    <p class="muted" style="font-size:12.5px">${n} graded session${n===1?"":"s"}. Hit rate counts directional calls only; give it about 30 sessions before trusting it.</p></section>`;
}
function research(br){
  const gd = r => r ? (r.result==="hit"?" ✓":r.result==="miss"?" ✗":r.result==="scratch"?" –":"") : "";
  const hist = `<section class="panel"><span class="eyebrow">Past briefs</span><div class="hist">${S.briefs.map(b=>{ const c = finalCall(b), g = b.grade||{};
      return `<button data-pick="${esc(b.id)}" aria-current="${b.id===br.id}"><span class="hd">${esc(fmtDate(b.date))}</span><span class="tag ${cls(c.NQ?.bias)}">NQ ${short(c.NQ?.bias)}${gd(g.NQ)}</span><span class="tag ${cls(c.ES?.bias)}">ES ${short(c.ES?.bias)}${gd(g.ES)}</span></button>`}).join("")}</div></section>`;
  const src = br.sources?.length ? `<section class="panel"><span class="eyebrow">Sources</span><ol class="sources">${br.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a></li>`).join("")}</ol></section>` : "";
  return `${trackRecord()}${factorAccuracy()}${hist}${src}`;
}
function sheet(){
  if(!S.sheet) return "";
  const card = s=>`<button class="skin" data-skin="${s.k}" aria-pressed="${S.skin===s.k}" style="background:linear-gradient(160deg,${s.dots[0]} 55%,${s.dots[1]}33);color:${s.light?"#141A2B":"#F4F1FF"}">
      <span class="sw">${s.dots.map(c=>`<i style="background:${c}"></i>`).join("")}</span><b>${esc(s.name)}</b><span style="color:inherit;opacity:.7">${esc(s.desc)}</span></button>`;
  const grp = (g, title, sub) => `<div class="skin-group"><b>${title}</b><span>${sub}</span></div><div class="skins">${SKINS.filter(s=>s.group===g).map(card).join("")}</div>`;
  const h = holidayNow(); const hs = h && SKINS.find(s=>s.k===h.k);
  const note = h && S.fx.holiday ? `<div class="hol-note">${esc(hs.name)} is on until ${h.until}. Your pick comes back after, or turn off holiday themes below.</div>` : "";
  const opt = (id, on, t, sub) => `<button class="fx-opt" id="${id}" aria-pressed="${on}"><span><b>${t}</b><small>${sub}</small></span><i class="sw2"></i></button>`;
  return `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Themes">
    <div class="sheet-head"><h2 style="font-stretch:120%">Themes</h2><button class="icon-btn" id="sheet-close" aria-label="Close">${IC.close}</button></div>
    ${note}
    ${grp("desk","Verdict","8 originals")}
    ${grp("conviction","From Conviction","22 themes")}
    ${grp("holiday","Holidays","switch on by themselves")}
    <div class="fx-opts">
      ${opt("fx-holiday", S.fx.holiday, "Holiday themes", "Switch to the holiday theme on its dates")}
      ${opt("fx-effects", S.fx.effects, "Holiday effects", "Bats, snow, leaves, confetti, hearts")}
      ${opt("fx-stars", S.fx.stars, "Stars on every theme", "Starfield's sky behind any theme")}
    </div>
    <p class="muted" style="font-size:12px;margin-top:10px">Saved on this device.</p></div></div>`;
}

function render(){
  const br = current();
  setMood(S.tab==="replay" ? chrono().find(b=>b.id===S.rp.day) || br : br);
  let body;
  if(S.tab === "replay") body = replay();
  else if(!br) body = empty();
  else if(S.tab === "nq") body = detail("NQ", br);
  else if(S.tab === "es") body = detail("ES", br);
  else if(S.tab === "research") body = research(br);
  else if(S.tab === "news") body = newsTab(br);
  else body = today(br);
  const top = header(br) + mtape() + (br ? strip(latest()) : "") + (S.tab==="today" && br && !S.tape?.macro?.length ? ticker(br) : "");
  const app = document.getElementById("app");
  app.innerHTML = top + body + `<p class="foot">Macro read for planning, not trade signals.</p>`;
  app.style.setProperty("--sync", (-(Date.now() % 42000) / 1000) + "s");
  const ek = S.tab + "|" + (br?.id || "") + "|" + (S.loaded ? 1 : 0);
  if(ek !== S.enterKey){ S.enterKey = ek; app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); clearTimeout(S.enterT); S.enterT = setTimeout(() => app.classList.remove("enter"), 1200); }
  if(document.getElementById("globe-host")) mountGlobe();
  document.getElementById("tabs").innerHTML = TABS.map(([k,l,ic])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${ic}<span>${l}</span></button>`).join("");
  document.getElementById("sheet-root").innerHTML = S.levels ? levelsSheet() : S.cardUrl ? cardSheet() : sheet();
  animateNeedles();
  if(S.tab==="replay"){ const sel = document.querySelector('.day[aria-current="true"]'); if(sel && sel.scrollIntoView) sel.scrollIntoView({block:"nearest",inline:"center"}); }
}

/* ---------- replay playback ---------- */
let rpTimer = null;
function rpStop(){ clearTimeout(rpTimer); rpTimer = null; S.rp.playing = false; }
function rpAdvance(){
  const days = chrono(); const b = days.find(x=>x.id===S.rp.day); const n = steps(b).length;
  if(S.rp.step < n - 1){ S.rp.step++; return true; }
  const i = days.indexOf(b); if(i < days.length - 1){ S.rp.day = days[i+1].id; S.rp.step = 0; return true; }
  return false;
}
function rpBack(){
  const days = chrono(); const b = days.find(x=>x.id===S.rp.day);
  if(S.rp.step > 0){ S.rp.step--; return; }
  const i = days.indexOf(b); if(i > 0){ S.rp.day = days[i-1].id; S.rp.step = steps(days[i-1]).length - 1; }
}
function rpTick(){ rpTimer = setTimeout(() => { if(!S.rp.playing) return; if(rpAdvance()){ render(); rpTick(); } else { rpStop(); render(); } }, STEP_MS); }
function rpPlay(){
  const days = chrono(); const b = days.find(x=>x.id===S.rp.day);
  if(b && days.indexOf(b) === days.length-1 && S.rp.step >= steps(b).length-1){ S.rp.day = days.length > 1 ? days[0].id : b.id; S.rp.step = 0; }
  S.rp.playing = true; render(); rpTick();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-place],[data-wview],[data-fold],#hero-more,[data-eng],[data-engf],[data-topic],[data-tn],.js-share,#story-more,#share-card,[data-cal],[data-calhi],[data-geo],[data-news],#news-more,[data-tab],[data-go],[data-pick],button[data-skin],[data-rday],[data-rstep],.pt,#run,#scan,#latest,#theme,#levels,#sheet-close,#scrim,#rp-play,#rp-prev,#rp-next,#fx-holiday,#fx-effects,#fx-stars");
  if(!t) return;
  if(t.id === "scrim" && e.target !== t) return;
  if(t.dataset.place){ S.worldSel = t.dataset.place; if(S.tab !== "news"){ S.tab = "news"; store.set("db-tab", "news"); } render(); const w = document.querySelector(".world"); if(w && e.target.closest(".movers,.nteaser")) w.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(t.dataset.wview){ S.worldView = t.dataset.wview; S.worldSel = null; render(); return; }
  if(t.dataset.fold){ const id = t.dataset.fold; const fs = S.folds; const cur = t.getAttribute("aria-expanded") === "true"; fs[id] = !cur; store.set("db-folds", JSON.stringify(fs)); render(); return; }
  if(t.id === "hero-more"){ S.heroMore = !S.heroMore; render(); return; }
  if(t.dataset.eng){ S.engSym = t.dataset.eng; render(); return; }
  if(t.dataset.engf){ S.engOpen = S.engOpen === t.dataset.engf ? null : t.dataset.engf; render(); return; }
  if(t.dataset.topic != null){ const k = t.dataset.topic || null; S.topic = S.topic === k ? null : k; S.tnSel = null; if(S.topic) S.folds.all = true; render(); return; }
  if(t.dataset.tn != null){ S.tnSel = +t.dataset.tn; render(); return; }
  if(t.classList.contains("js-share")){ const b = current(); if(b) makeCard(b).catch(err => { S.runMsg = "Couldn't make the card: " + err.message; S.runErr = true; render(); }); return; }
  if(t.id === "story-more"){ S.storyAll = !S.storyAll; render(); return; }
  if(t.id === "share-card"){ const b = current(); if(b) makeCard(b).catch(err => { S.runMsg = "Couldn't make the card: " + err.message; S.runErr = true; render(); }); return; }
  if(t.dataset.cal){ S.calCur = t.dataset.cal; render(); return; }
  if(t.dataset.calhi){ S.calHigh = !S.calHigh; render(); return; }
  if(t.dataset.geo != null){ S.geoSel = +t.dataset.geo; render(); return; }
  if(t.id === "latest"){ e.preventDefault(); S.selected = null; render(); return; }
  if(t.id === "run"){ runNow(); return; }
  if(t.id === "scan"){ scanNow(); return; }
  if(t.id === "theme"){ S.sheet = true; render(); return; }
  if(t.dataset.news){ S.newsHigh = t.dataset.news === "high"; S.newsAll = false; render(); return; }
  if(t.id === "news-more"){ S.newsAll = !S.newsAll; render(); return; }
  if(t.id === "levels"){ S.levels = true; S.saveMsg = null; render(); return; }
  if(t.id === "sheet-close" || t.id === "scrim"){ S.sheet = false; S.levels = false; if(S.cardUrl){ URL.revokeObjectURL(S.cardUrl); S.cardUrl = null; } render(); return; }
  if(t.dataset.skin){ applySkin(t.dataset.skin); store.set("db-skin", S.skin); render(); return; }
  if(t.id === "fx-holiday" || t.id === "fx-effects" || t.id === "fx-stars"){ const k = t.id.slice(3); S.fx[k] = !S.fx[k]; store.set("db-fx-"+k, S.fx[k]?"1":"0"); applySkin(); render(); return; }
  if(t.id === "rp-play"){ S.rp.playing ? (rpStop(), render()) : rpPlay(); return; }
  if(t.id === "rp-next"){ rpStop(); rpAdvance(); render(); return; }
  if(t.id === "rp-prev"){ rpStop(); rpBack(); render(); return; }
  if(t.dataset.rday || t.dataset.day){ rpStop(); S.rp.day = t.dataset.rday || t.dataset.day; S.rp.step = 0; S.tab = "replay"; render(); return; }
  if(t.dataset.rstep != null){ rpStop(); S.rp.step = +t.dataset.rstep; render(); return; }
  if(t.dataset.pick){ S.selected = t.dataset.pick; S.tab = "today"; }
  else { if(S.tab === "replay") rpStop(); S.tab = t.dataset.tab || t.dataset.go; }
  store.set("db-tab", S.tab); render(); window.scrollTo({top:0});
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && (S.sheet || S.levels || S.cardUrl)){ S.sheet = false; S.levels = false; S.cardUrl = null; render(); }
  if(S.tab === "replay" && !S.sheet && !S.levels && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){
    if(e.key === "ArrowRight"){ rpStop(); rpAdvance(); render(); }
    if(e.key === "ArrowLeft"){ rpStop(); rpBack(); render(); }
    if(e.key === " " && e.target === document.body){ e.preventDefault(); S.rp.playing ? (rpStop(), render()) : rpPlay(); }
  }
});
document.addEventListener("submit", e => {
  if(e.target.id !== "levels-form") return;
  e.preventDefault(); saveLevels(e.submitter?.dataset?.after || "save");
});

async function runNow(){
  const mcp = await claude.use("mcp");
  if(!mcp){ S.runMsg = "Running from the page isn't available in this view."; S.runErr = true; render(); return; }
  S.running = true; S.runMsg = null; S.runErr = false; render();
  try{
    await mcp.callTool(CONNECTOR, "fire_trigger", {trigger_id: TRIGGER_ID, text: "Manual run requested from the Verdict page. Pick the phase and session date from the current ET time as the instructions say."}, {cache:false});
    S.runMsg = null; S.awaitFrom = Date.now(); store.set("db-await", String(S.awaitFrom));
  }catch(err){
    S.runErr = true; const c = err && err.code;
    S.runMsg = c==="server_not_connected" ? "Add Claude Code Remote in claude.ai Settings → Connectors to run from here."
      : c==="needs_reauth" ? "Reconnect Claude Code Remote in claude.ai Settings → Connectors."
      : c==="not_in_manifest" || c==="not_granted" ? "You declined running from this page. Reload to be asked again."
      : c==="tool_error" ? "The run didn't start: " + (err.message || "the scheduled task reported an error.")
      : c==="server_unavailable" ? "Couldn't reach the scheduler. Wait a minute before tapping again; the run may have started."
      : "The run didn't start (" + (c || "unknown error") + ").";
  }
  S.running = false; render();
}

async function scanNow(){
  const mcp = await claude.use("mcp");
  if(!mcp){ S.runMsg = "Scanning from the page isn't available in this view."; S.runErr = true; render(); return; }
  S.scanFrom = Date.now(); store.set("db-scan", String(S.scanFrom)); S.runMsg = null; render();
  try{
    await mcp.callTool(CONNECTOR, "fire_trigger", {trigger_id: WATCH_ID, text: "Manual scan requested from the Verdict page."}, {cache:false});
    S.runMsg = "Scanning the feeds and NQ price now. Results land here in a few minutes."; S.runErr = false;
  }catch(err){
    S.scanFrom = null; store.set("db-scan", ""); S.runErr = true; const c = err && err.code;
    S.runMsg = c==="server_not_connected" ? "Add Claude Code Remote in claude.ai Settings → Connectors to scan from here."
      : c==="not_in_manifest" || c==="not_granted" ? "You declined running from this page. Reload to be asked again."
      : "The scan didn't start (" + (c || "unknown error") + ").";
  }
  render();
}
